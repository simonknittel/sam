# Host ports are overridable so that multiple git worktrees can run their own
# stack side by side (each worktree sets the SAM_*_PORT variables in a
# gitignored .env next to this file, see .agents/skills/run-app/SKILL.md).

# The largest event that Soketi accepts, in kilobytes, for the soketi service
# and the relay service (see
# docs/setup-test-and-production.md#10-set-up-the-relay-service-of-the-remote-control-program)
x-soketi-maximum-event-payload-kilobytes: &soketi-maximum-event-payload-kilobytes "100"

services:

  # PostgreSQL with TimescaleDB, like the servers (see
  # docs/setup-local-machine.md). The Playwright stack and the integration
  # tests of the application package use the same image and options.
  # Do not use a version below PostgreSQL 18.7: 18.6 refuses column options
  # that 18.7 writes.
  psql:
    image: timescale/timescaledb:2.32.1-pg18@sha256:70e6526ad8e31e3f4833f2c5863b50b92d7a6bee4d432ad1f660e2c6dd956d94
    restart: no
    # The image writes shared_preload_libraries into postgresql.conf only when
    # it makes a new data folder. The command line loads TimescaleDB for each
    # data folder.
    command:
      - postgres
      - -c
      - shared_preload_libraries=timescaledb
      - -c
      - timescaledb.telemetry_level=off
    environment:
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: db
      # Without this, the image tunes a new data folder for all the memory of
      # the host (for example shared_buffers). With it, the PostgreSQL defaults
      # stay.
      NO_TS_TUNE: "true"
    ports:
      - ${SAM_PSQL_PORT:-5432}:5432
    # Init scripts run only for a new, empty data folder. For the volume, see
    # the database section of docs/setup-local-machine.md.
    configs:
      - source: psql-create-unleash-db
        target: /docker-entrypoint-initdb.d/create-unleash-db.sql
    # TCP (instead of the default Unix socket) so the temporary init-phase
    # server — which only listens on the socket and may still be running the
    # init scripts — never reports healthy
    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "--host",
          "127.0.0.1",
          "--username",
          "postgres",
          "--dbname",
          "db",
        ]
      interval: 5s
      timeout: 3s
      retries: 12

  soketi:
    image: quay.io/soketi/soketi:1.6.1-16-distroless@sha256:22486a3b4ac387a3c7ee97963cccf5189d38c0a54b0d75f10c0881d60437a77a
    restart: no
    environment:
      SOKETI_DEFAULT_APP_USER_AUTHENTICATION: "true"
      SOKETI_EVENT_MAX_SIZE_IN_KB: *soketi-maximum-event-payload-kilobytes
    ports:
      - ${SAM_SOKETI_PORT:-6001}:6001
      - ${SAM_SOKETI_METRICS_PORT:-9601}:9601

  # Local S3-compatible object storage for uploads (see
  # docs/setup-local-machine.md for the app-side environment variables). The
  # app and uploaded-file URLs both use the S3 port. Reads are anonymous so
  # uploaded files can be displayed without signed URLs, mirroring the public
  # bucket used in deployments.
  rustfs:
    image: rustfs/rustfs:1.0.0-rc.2@sha256:7d6d361c49c08d427250fb59aae5d78df83d644c3405d9ccf4b21cda0b0692d0
    restart: no
    # Local-only credentials; must match the S3_* variables in
    # pnpm-monorepo/apps/app/.env.example
    environment:
      RUSTFS_ACCESS_KEY: sam-local-dev
      RUSTFS_SECRET_KEY: sam-local-dev-insecure
    ports:
      - ${SAM_RUSTFS_PORT:-9000}:9000
    healthcheck:
      test: ["CMD", "curl", "--silent", "--fail", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 12

  # One-shot helper which creates the uploads bucket on startup and applies
  # the anonymous-read policy and the CORS rules (the browser PUTs to
  # presigned URLs cross-origin). Safe to re-run.
  rustfs-bootstrap:
    image: amazon/aws-cli:2.42.5@sha256:4e569d37c0b93893f660946f9b00a442b1172b1c4ba86338a3a1af3937ed62b5
    restart: no
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: sam-local-dev
      AWS_SECRET_ACCESS_KEY: sam-local-dev-insecure
      AWS_REGION: us-east-1
    configs:
      - source: rustfs-anonymous-read-policy
        target: /bootstrap/policy.json
      - source: rustfs-cors
        target: /bootstrap/cors.json
    entrypoint: /bin/sh
    command: >-
      -c "aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket uploads 2>/dev/null
      || aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket uploads;
      aws --endpoint-url http://rustfs:9000 s3api put-bucket-policy --bucket uploads --policy file:///bootstrap/policy.json
      && aws --endpoint-url http://rustfs:9000 s3api put-bucket-cors --bucket uploads --cors-configuration file:///bootstrap/cors.json"

  # Local feature flag server (see docs/setup-local-machine.md for the
  # app-side environment variables). Admin UI: http://localhost:4242 with
  # the default credentials admin / unleash4all. Flags live in the extra
  # `unleash` database of the psql service (see the psql-create-unleash-db
  # config).
  unleash:
    image: unleashorg/unleash-server:8.3.1@sha256:025cd8b003a70cceb88427ca393c377ca6503a210d95fdee54d21610d51f7ed0
    restart: no
    depends_on:
      psql:
        condition: service_healthy
    # Local-only tokens; the backend token must match UNLEASH_SERVER_API_TOKEN
    # in pnpm-monorepo/apps/app/.env.example
    environment:
      DATABASE_URL: postgres://postgres:admin@psql:5432/unleash
      DATABASE_SSL: "false"
      INIT_BACKEND_API_TOKENS: default:development.sam-insecure-api-token
      INIT_ADMIN_API_TOKENS: "*:*.unleash-insecure-admin-token"
    ports:
      - ${SAM_UNLEASH_PORT:-4242}:4242
    # The startup migrations of a fresh database take a while, hence the
    # generous retries
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4242/health').then((response) => process.exit(response.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 36

  # One-shot helper which creates the app's feature flags (all disabled) on
  # startup so they can be toggled in the Unleash admin UI right away. Safe
  # to re-run.
  unleash-bootstrap:
    image: unleashorg/unleash-server:8.3.1@sha256:025cd8b003a70cceb88427ca393c377ca6503a210d95fdee54d21610d51f7ed0
    restart: no
    depends_on:
      unleash:
        condition: service_healthy
    configs:
      - source: unleash-create-flags
        target: /bootstrap/create-flags.mjs
    entrypoint: ["node", "/bootstrap/create-flags.mjs"]

  # Wiki realtime collaboration backend (see docs/setup-local-machine.md for
  # the app-side environment variables). Rebuild after changing
  # pnpm-monorepo/apps/collab: `docker compose build sam-collab`
  sam-collab:
    build:
      context: ./pnpm-monorepo
      dockerfile: apps/collab/Dockerfile
    restart: no
    depends_on:
      - psql
    environment:
      DATABASE_URL: postgresql://postgres:admin@psql:5432/db
      COLLAB_JWT_SECRET: insecure-dev-secret
    ports:
      - ${SAM_COLLAB_PORT:-5210}:5210

  # Relay service of the Remote Control Program (see
  # docs/setup-local-machine.md for the app-side environment variables).
  # Rebuild after a change of pnpm-monorepo/apps/relay or of its workspace
  # packages: `docker compose up -d --build sam-relay`. The run-app skill
  # (up.sh) starts it after the migrations.
  sam-relay:
    build:
      context: ./pnpm-monorepo
      dockerfile: apps/relay/Dockerfile
    restart: no
    # Without the conditions, the relay service logs errors until the
    # database and Unleash are ready
    depends_on:
      psql:
        condition: service_healthy
      soketi:
        condition: service_started
      unleash:
        condition: service_healthy
    # The run-app skill (up.sh) writes the SAM_APP_* variables into the .env
    # next to this file (see the grafana service)
    environment:
      DATABASE_URL: postgresql://postgres:admin@psql:5432/db
      APP_BASE_URL: ${SAM_APP_BASE_URL:-http://localhost:3000}
      APP_ORIGIN: ${SAM_APP_ORIGIN:-http://localhost:3000}
      # The key set inline, not from the URL of the app (see
      # docs/setup-local-machine.md#remote-control-program-relay-service)
      APP_JWKS_BASE64: ${SAM_APP_JWK_SET_VALUE:-eyJrZXlzIjpbXX0=}
      # The default app of the soketi service
      PUSHER_CHANNELS_APP_ID: app-id
      PUSHER_CHANNELS_APP_KEY: app-key
      PUSHER_CHANNELS_APP_SECRET: app-secret
      PUSHER_CHANNELS_HOST: soketi
      PUSHER_CHANNELS_PORT: "6001"
      PUSHER_CHANNELS_MAXIMUM_EVENT_PAYLOAD_KILOBYTES: *soketi-maximum-event-payload-kilobytes
      # The backend token of the unleash service
      UNLEASH_SERVER_API_URL: http://unleash:4242/api
      UNLEASH_SERVER_API_TOKEN: default:development.sam-insecure-api-token
    ports:
      - ${SAM_RELAY_PORT:-5220}:5220

  # Headless OpenTelemetry collector for local tracing work (see
  # docs/setup-local-machine.md). Without the OTEL_* variables of the app and
  # of the relay service, it receives nothing and idles.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.166.0@sha256:3e18fe04181de50bdd72e23ad4a4d6214b54351e63d496f1c58127cc4541ad7f
    restart: no
    # The image runs as uid 10001, which cannot write to the volume below: a
    # named volume of a path that the image does not contain belongs to root.
    # This container is local-only and holds no data of value.
    user: "0:0"
    configs:
      - source: otel-collector-config
        target: /etc/otelcol-contrib/config.yaml
    volumes:
      - otel-collector-output:/output
    ports:
      - ${SAM_OTEL_COLLECTOR_PORT:-4318}:4318

  # Grafana that shows the statistics dashboard on /app/statistics (see
  # docs/setup-local-machine.md). It has the settings of a production
  # Grafana: only a valid embed token of the app opens it, with the role
  # Viewer. Grafana reads a changed dashboard file in some seconds. After a
  # change of a different file under grafana/, do
  # `docker compose restart grafana`.
  grafana:
    image: grafana/grafana:13.3.2@sha256:81556409ba48b2b922e0adb69a2511337d8ba7578f11962eefa6149a2d815101
    restart: no
    depends_on:
      grafana-bootstrap:
        condition: service_completed_successfully
    # The `run-app` skill (up.sh) writes the SAM_APP_* variables and
    # SAM_GRAFANA_PORT into the .env next to this file. The sam-relay service
    # uses the same SAM_APP_* variables.
    environment:
      SAM_GRAFANA_ROOT_URL: http://127.0.0.1:${SAM_GRAFANA_PORT:-3100}/
      # The issuer of the embed tokens: NEXT_PUBLIC_BASE_URL of the app
      SAM_GRAFANA_APP_BASE_URL: ${SAM_APP_BASE_URL:-http://localhost:3000}
      # The origin of the app in the browser, the only origin that can show
      # Grafana in a frame. It is different from the issuer in a worktree,
      # because NEXT_PUBLIC_BASE_URL does not change with the port.
      SAM_GRAFANA_APP_ORIGIN: ${SAM_APP_ORIGIN:-http://localhost:3000}
      # The base64 of the JSON Web Key Set of the EMBED_JWT_PRIVATE_KEY of
      # the app. The default is an empty key set: Grafana then refuses each
      # token.
      SAM_GRAFANA_JWK_SET_VALUE: ${SAM_APP_JWK_SET_VALUE:-eyJrZXlzIjpbXX0=}
      # Editor mode, off by default like in production. With a password,
      # Grafana makes the user `admin` and shows the login form, so that you
      # can change the dashboard and export it. Without a password, these
      # three values are empty, and Grafana ignores an empty variable.
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: ${SAM_GRAFANA_ADMIN_PASSWORD:+false}
      GF_SECURITY_ADMIN_PASSWORD: ${SAM_GRAFANA_ADMIN_PASSWORD:-}
      GF_AUTH_DISABLE_LOGIN_FORM: ${SAM_GRAFANA_ADMIN_PASSWORD:+false}
    # Only the two provisioning files: a mount of the full provisioning
    # directory without the other subdirectories causes errors in the log
    configs:
      - source: grafana-ini
        target: /etc/grafana/grafana.ini
      - source: grafana-datasources
        target: /etc/grafana/provisioning/datasources/statistics.yaml
      - source: grafana-dashboards
        target: /etc/grafana/provisioning/dashboards/statistics.yaml
    volumes:
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    # Only on the loopback interface, also in editor mode. The app opens
    # 127.0.0.1, which is a different site than localhost, like a production
    # Grafana on its own domain.
    ports:
      - 127.0.0.1:${SAM_GRAFANA_PORT:-3100}:3000

  # One-shot helper which makes the read-only database role of the grafana
  # service and sets its local password. The SQL file expects the schema and
  # must run as a superuser (locally postgres, which also applies the
  # migrations, thus it owns the views). Safe to re-run.
  # It runs before the migrations. Thus it makes the schema and the extension
  # timescaledb itself (the migrations then find them).
  grafana-bootstrap:
    image: postgres:18.7-alpine3.23@sha256:339a86bf416979bb4d3d2e30a1f9e096e7302564faff4151b804cf53463059d5
    restart: no
    depends_on:
      psql:
        condition: service_healthy
    environment:
      PGHOST: psql
      PGUSER: postgres
      PGPASSWORD: admin
      PGDATABASE: db
    configs:
      - source: statistics-reader-role
        target: /bootstrap/statistics-reader-role.sql
    # The password must match grafana/provisioning/datasources/statistics.yaml
    entrypoint:
      - psql
      - --set=ON_ERROR_STOP=1
      - --command=CREATE EXTENSION IF NOT EXISTS timescaledb
      - --command=CREATE SCHEMA IF NOT EXISTS statistics
      - --file=/bootstrap/statistics-reader-role.sql
      - --command=ALTER ROLE sam_statistics_grafana PASSWORD 'sam-statistics-local-insecure'

volumes:
  # Holds the received telemetry (see docs/setup-local-machine.md).
  otel-collector-output:

configs:
  psql-create-unleash-db:
    content: |
      CREATE DATABASE unleash;
  # The flag names must match the UNLEASH_FLAG enum in
  # pnpm-monorepo/apps/app/src/modules/common/utils/UNLEASH_FLAG.ts and
  # RemoteControlProgramUnleashFlag in
  # pnpm-monorepo/packages/domain/src/remoteControlProgram/catalog.ts
  unleash-create-flags:
    content: |
      const flagNames = [
        "EnableCareBearShooter",
        "DisableRoleNameSuggestions",
        "CrashLogAnalyzer",
        "DisableMcpServer",
        "DisableRemoteControlProgram",
      ];

      const FLAG_ALREADY_EXISTS_STATUS = 409;

      for (const flagName of flagNames) {
        const response = await fetch(
          "http://unleash:4242/api/admin/projects/default/features",
          {
            method: "POST",
            headers: {
              Authorization: "*:*.unleash-insecure-admin-token",
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ name: flagName }),
            signal: AbortSignal.timeout(5000),
          },
        );

        // No template literals — Docker Compose would interpolate their $${...} placeholders
        if (!response.ok && response.status !== FLAG_ALREADY_EXISTS_STATUS)
          throw new Error(
            "Creating the flag " + flagName + " failed: " + response.status,
          );
      }

  # Unauthenticated reads of uploaded files — public by unguessable URL,
  # like the real bucket
  rustfs-anonymous-read-policy:
    content: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Effect": "Allow",
            "Principal": { "AWS": ["*"] },
            "Action": ["s3:GetObject"],
            "Resource": ["arn:aws:s3:::uploads/*"]
          }
        ]
      }
  rustfs-cors:
    content: |
      {
        "CORSRules": [
          {
            "AllowedOrigins": ["*"],
            "AllowedMethods": ["GET", "PUT", "HEAD"],
            "AllowedHeaders": ["*"],
            "ExposeHeaders": ["ETag"],
            "MaxAgeSeconds": 3600
          }
        ]
      }

  # Everything that arrives goes into a file, unchanged: one JSON line per
  # received OTLP request. The file exporter truncates its file when the
  # container starts, which is how a measurement begins clean.
  otel-collector-config:
    content: |
      receivers:
        otlp:
          protocols:
            http:
              endpoint: 0.0.0.0:4318

      exporters:
        file/traces:
          path: /output/traces.jsonl
        file/logs:
          path: /output/logs.jsonl
        file/metrics:
          path: /output/metrics.jsonl

      service:
        pipelines:
          traces:
            receivers: [otlp]
            exporters: [file/traces]
          logs:
            receivers: [otlp]
            exporters: [file/logs]
          # Only the relay service sends metrics
          metrics:
            receivers: [otlp]
            exporters: [file/metrics]

  grafana-ini:
    file: ./grafana/grafana.ini
  grafana-datasources:
    file: ./grafana/provisioning/datasources/statistics.yaml
  grafana-dashboards:
    file: ./grafana/provisioning/dashboards/statistics.yaml
  statistics-reader-role:
    file: ./pnpm-monorepo/packages/database/prisma/statistics-reader-role.sql
