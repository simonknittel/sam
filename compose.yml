# Host ports are overridable so that multiple git worktrees can run their own
# stack side by side (each worktree sets the SAM_*_PORT variables in a
# gitignored .env next to this file, see .agents/skills/run-app/SKILL.md).
services:

  psql:
    image: postgres:18.4-alpine3.23@sha256:996d0920e4ff9df1fc19dacb904492f3c1ec0ec1cc338f0ad7123be7731c5f5e
    restart: no
    environment:
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: db
    ports:
      - ${SAM_PSQL_PORT:-5432}:5432

  soketi:
    image: quay.io/soketi/soketi:1.6.1-16-distroless@sha256:22486a3b4ac387a3c7ee97963cccf5189d38c0a54b0d75f10c0881d60437a77a
    restart: no
    environment:
      SOKETI_DEFAULT_APP_USER_AUTHENTICATION: "true"
    ports:
      - ${SAM_SOKETI_PORT:-6001}:6001
      - ${SAM_SOKETI_METRICS_PORT:-9601}:9601

  # Wiki realtime collaboration backend (see docs/setup-local-machine.md for
  # the app-side environment variables). Rebuild after changing
  # pnpm-monorepo/apps/collab: `docker compose build sam-collab`
  sam-collab:
    build:
      context: ./pnpm-monorepo
      dockerfile: apps/collab/Dockerfile
    restart: no
    depends_on:
      - psql
    environment:
      DATABASE_URL: postgresql://postgres:admin@psql:5432/db
      COLLAB_JWT_SECRET: insecure-dev-secret
    ports:
      - ${SAM_COLLAB_PORT:-5210}:5210
