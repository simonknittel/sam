# Host ports are overridable so that multiple git worktrees can run their own
# stack side by side (each worktree sets the SAM_*_PORT variables in a
# gitignored .env next to this file, see .agents/skills/run-app/SKILL.md).
services:

  psql:
    image: postgres:18.4-alpine3.23@sha256:996d0920e4ff9df1fc19dacb904492f3c1ec0ec1cc338f0ad7123be7731c5f5e
    restart: no
    environment:
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: db
    ports:
      - ${SAM_PSQL_PORT:-5432}:5432
    # Init scripts only run when the data directory is empty, i.e. when the
    # container is created — which is every `docker compose up` here since no
    # volume is mounted.
    configs:
      - source: psql-create-unleash-db
        target: /docker-entrypoint-initdb.d/create-unleash-db.sql
    # TCP (instead of the default Unix socket) so the temporary init-phase
    # server — which only listens on the socket and may still be running the
    # init scripts — never reports healthy
    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "--host",
          "127.0.0.1",
          "--username",
          "postgres",
          "--dbname",
          "db",
        ]
      interval: 5s
      timeout: 3s
      retries: 12

  soketi:
    image: quay.io/soketi/soketi:1.6.1-16-distroless@sha256:22486a3b4ac387a3c7ee97963cccf5189d38c0a54b0d75f10c0881d60437a77a
    restart: no
    environment:
      SOKETI_DEFAULT_APP_USER_AUTHENTICATION: "true"
    ports:
      - ${SAM_SOKETI_PORT:-6001}:6001
      - ${SAM_SOKETI_METRICS_PORT:-9601}:9601

  # Local S3-compatible object storage for uploads (see
  # docs/setup-local-machine.md for the app-side environment variables). The
  # app and uploaded-file URLs both use the S3 port. Reads are anonymous so
  # uploaded files can be displayed without signed URLs, mirroring the public
  # bucket used in deployments.
  rustfs:
    image: rustfs/rustfs:1.0.0-rc.2@sha256:7d6d361c49c08d427250fb59aae5d78df83d644c3405d9ccf4b21cda0b0692d0
    restart: no
    # Local-only credentials; must match the S3_* variables in
    # pnpm-monorepo/apps/app/.env.example
    environment:
      RUSTFS_ACCESS_KEY: sam-local-dev
      RUSTFS_SECRET_KEY: sam-local-dev-insecure
    ports:
      - ${SAM_RUSTFS_PORT:-9000}:9000
    healthcheck:
      test: ["CMD", "curl", "--silent", "--fail", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 12

  # One-shot helper which creates the uploads bucket on startup and applies
  # the anonymous-read policy and the CORS rules (the browser PUTs to
  # presigned URLs cross-origin). Safe to re-run.
  rustfs-bootstrap:
    image: amazon/aws-cli:2.36.19@sha256:7e78b80fc653b9f6bdacc54709458910374da3213e3a19abdaf395680831a5da
    restart: no
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: sam-local-dev
      AWS_SECRET_ACCESS_KEY: sam-local-dev-insecure
      AWS_REGION: us-east-1
    configs:
      - source: rustfs-anonymous-read-policy
        target: /bootstrap/policy.json
      - source: rustfs-cors
        target: /bootstrap/cors.json
    entrypoint: /bin/sh
    command: >-
      -c "aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket uploads 2>/dev/null
      || aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket uploads;
      aws --endpoint-url http://rustfs:9000 s3api put-bucket-policy --bucket uploads --policy file:///bootstrap/policy.json
      && aws --endpoint-url http://rustfs:9000 s3api put-bucket-cors --bucket uploads --cors-configuration file:///bootstrap/cors.json"

  # Local feature flag server (see docs/setup-local-machine.md for the
  # app-side environment variables). Admin UI: http://localhost:4242 with
  # the default credentials admin / unleash4all. Flags live in the extra
  # `unleash` database of the psql service (see the psql-create-unleash-db
  # config).
  unleash:
    image: unleashorg/unleash-server:8.1.0@sha256:16f3ffb914880e7d0f23629a0c1b77aebea3aa619b0305f76eb50b3fb75998a9
    restart: no
    depends_on:
      psql:
        condition: service_healthy
    # Local-only tokens; the backend token must match UNLEASH_SERVER_API_TOKEN
    # in pnpm-monorepo/apps/app/.env.example
    environment:
      DATABASE_URL: postgres://postgres:admin@psql:5432/unleash
      DATABASE_SSL: "false"
      INIT_BACKEND_API_TOKENS: default:development.unleash-insecure-api-token
      INIT_ADMIN_API_TOKENS: "*:*.unleash-insecure-admin-token"
    ports:
      - ${SAM_UNLEASH_PORT:-4242}:4242
    # The startup migrations of a fresh database take a while, hence the
    # generous retries
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4242/health').then((response) => process.exit(response.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 36

  # One-shot helper which creates the app's feature flags (all disabled) on
  # startup so they can be toggled in the Unleash admin UI right away. Safe
  # to re-run.
  unleash-bootstrap:
    image: unleashorg/unleash-server:8.1.0@sha256:16f3ffb914880e7d0f23629a0c1b77aebea3aa619b0305f76eb50b3fb75998a9
    restart: no
    depends_on:
      unleash:
        condition: service_healthy
    configs:
      - source: unleash-create-flags
        target: /bootstrap/create-flags.mjs
    entrypoint: ["node", "/bootstrap/create-flags.mjs"]

  # Wiki realtime collaboration backend (see docs/setup-local-machine.md for
  # the app-side environment variables). Rebuild after changing
  # pnpm-monorepo/apps/collab: `docker compose build sam-collab`
  sam-collab:
    build:
      context: ./pnpm-monorepo
      dockerfile: apps/collab/Dockerfile
    restart: no
    depends_on:
      - psql
    environment:
      DATABASE_URL: postgresql://postgres:admin@psql:5432/db
      COLLAB_JWT_SECRET: insecure-dev-secret
    ports:
      - ${SAM_COLLAB_PORT:-5210}:5210

configs:
  psql-create-unleash-db:
    content: |
      CREATE DATABASE unleash;
  # The flag names must match the UNLEASH_FLAG enum in
  # pnpm-monorepo/apps/app/src/modules/common/utils/UNLEASH_FLAG.ts
  unleash-create-flags:
    content: |
      const flagNames = [
        "DisableAlgolia",
        "EnableCareBearShooter",
        "DisableRoleNameSuggestions",
        "CrashLogAnalyzer",
      ];

      const FLAG_ALREADY_EXISTS_STATUS = 409;

      for (const flagName of flagNames) {
        const response = await fetch(
          "http://unleash:4242/api/admin/projects/default/features",
          {
            method: "POST",
            headers: {
              Authorization: "*:*.unleash-insecure-admin-token",
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ name: flagName }),
            signal: AbortSignal.timeout(5000),
          },
        );

        // No template literals — Docker Compose would interpolate their $${...} placeholders
        if (!response.ok && response.status !== FLAG_ALREADY_EXISTS_STATUS)
          throw new Error(
            "Creating the flag " + flagName + " failed: " + response.status,
          );
      }

  # Unauthenticated reads of uploaded files — public by unguessable URL,
  # like the real bucket
  rustfs-anonymous-read-policy:
    content: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Effect": "Allow",
            "Principal": { "AWS": ["*"] },
            "Action": ["s3:GetObject"],
            "Resource": ["arn:aws:s3:::uploads/*"]
          }
        ]
      }
  rustfs-cors:
    content: |
      {
        "CORSRules": [
          {
            "AllowedOrigins": ["*"],
            "AllowedMethods": ["GET", "PUT", "HEAD"],
            "AllowedHeaders": ["*"],
            "ExposeHeaders": ["ETag"],
            "MaxAgeSeconds": 3600
          }
        ]
      }
