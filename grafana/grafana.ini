# Settings of a Grafana that shows the statistics dashboard of SAM (see
# docs/setup-test-and-production.md). The `grafana` service of compose.yml
# sets the $__env{...} values.

[server]
root_url = $__env{SAM_GRAFANA_ROOT_URL}

[security]
disable_initial_admin_creation = true
allow_embedding = true
content_security_policy = true
content_security_policy_template = """frame-ancestors $__env{SAM_GRAFANA_APP_ORIGIN}"""
# Removes a deprecation warning from the start log
x_xss_protection = false
disable_gravatar = true

[auth]
disable_login_form = true
disable_signout_menu = true

[auth.basic]
enabled = false

[auth.anonymous]
enabled = false

[auth.jwt]
enabled = true
header_name = X-JWT-Assertion
username_claim = sub
# A production Grafana uses `jwk_set_url = <base URL of SAM>/.well-known/jwks.json`
# instead. Grafana accepts only an https URL there. Thus the local Grafana
# gets the key set inline: the base64 of the JSON Web Key Set.
jwk_set_value = $__env{SAM_GRAFANA_JWK_SET_VALUE}
cache_ttl = 60m
expect_claims = {"iss": "$__env{SAM_GRAFANA_APP_BASE_URL}", "aud": "sam-statistics-grafana"}
auto_sign_up = true
url_login = true
allow_assign_grafana_admin = false

[users]
allow_sign_up = false
allow_org_create = false
auto_assign_org = true
auto_assign_org_role = Viewer
default_theme = dark
default_language = de-DE

[public_dashboards]
enabled = false

[snapshots]
enabled = false

[explore]
enabled = false

[unified_alerting]
enabled = false

[alerting]
enabled = false

[live]
max_connections = 0

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
feedback_links_enabled = false

[news]
news_feed_enabled = false

[plugins]
# Grafana 12+ downloads some app plugins at the start without this setting
preinstall_disabled = true
