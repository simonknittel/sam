name: Playwright tests

# The paths cover everything the test stack is built from: the app and the
# collab image (built from the checkout), the workspace packages, and the
# workspace plumbing. Lambda- or scripts-only changes don't run the suite.
on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/playwright-tests.yml
      - pnpm-monorepo/.nvmrc
      - pnpm-monorepo/package.json
      - pnpm-monorepo/apps/app/**
      - pnpm-monorepo/apps/collab/**
      - pnpm-monorepo/apps/playwright/**
      - pnpm-monorepo/packages/**
      - pnpm-monorepo/pnpm-lock.yaml
      - pnpm-monorepo/pnpm-workspace.yaml
  push:
    branches:
      - main
    paths:
      - .github/workflows/playwright-tests.yml
      - pnpm-monorepo/.nvmrc
      - pnpm-monorepo/package.json
      - pnpm-monorepo/apps/app/**
      - pnpm-monorepo/apps/collab/**
      - pnpm-monorepo/apps/playwright/**
      - pnpm-monorepo/packages/**
      - pnpm-monorepo/pnpm-lock.yaml
      - pnpm-monorepo/pnpm-workspace.yaml

# Only one run per branch at a time. A new run cancels the run that is still
# in progress, because only the result for the latest commit matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright_tests:
    name: Playwright tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: pnpm-monorepo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.24.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: pnpm-monorepo/.nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-monorepo/pnpm-lock.yaml

      - name: pnpm audit guard
        run: pnpm audit

      - name: Install dependencies
        run: pnpm install --filter @sam-monorepo/app... --filter @sam-monorepo/playwright...
        env:
          # The app's postinstall runs `next typegen`, which loads src/env.ts;
          # none of the runtime secrets exist here. The tests themselves run
          # WITH validation — the stack provides substitute values.
          SKIP_VALIDATION: "1"

      - name: Install Playwright browsers
        run: pnpm --filter @sam-monorepo/playwright exec playwright install --with-deps chromium

      # Spawns the whole stack itself: Postgres and collab containers via
      # testcontainers (the runner's Docker daemon) plus a production build
      # of the app per worker.
      - name: Run tests
        run: pnpm --filter @sam-monorepo/playwright test

      - name: Upload test report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: pnpm-monorepo/apps/playwright/playwright-report/
          retention-days: 7
