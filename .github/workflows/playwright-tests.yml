name: Playwright tests

on:
  schedule:
    - cron: '0 0,8,16 * * *'
  workflow_dispatch:
  workflow_call: # Called by the Release workflow after a production deployment

jobs:
  smoke_test:
    name: Playwright tests
    runs-on: ubuntu-24.04
    environment: Production
    permissions:
      contents: read
    container:
      # Must stay on the same version as `@playwright/test` in
      # apps/playwright/package.json. The image only ships the browser builds of
      # its own version, so a mismatch fails with "Executable doesn't exist".
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --user 1001
    defaults:
      run:
        working-directory: pnpm-monorepo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.17.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: pnpm-monorepo/.nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-monorepo/pnpm-lock.yaml

      - name: pnpm audit guard
        run: pnpm audit
        working-directory: pnpm-monorepo

      - name: Install dependencies
        run: pnpm install --filter @sam-monorepo/playwright

      - name: Run tests
        run: pnpm --filter @sam-monorepo/playwright test
        env:
          BASE_URL: ${{ vars.BASE_URL }}
          PLAYWRIGHT_CUSTOM_HEADER_NAME: ${{ vars.PLAYWRIGHT_CUSTOM_HEADER_NAME }}
          PLAYWRIGHT_CUSTOM_HEADER_VALUE: ${{ secrets.PLAYWRIGHT_CUSTOM_HEADER_VALUE }}

      - name: Upload test report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: pnpm-monorepo/apps/playwright/playwright-report/
          retention-days: 7
