name: Renovate

on:
  schedule:
    - cron: "0 0,6,12,18 * * *"
      timezone: "Europe/Berlin"
  workflow_dispatch: # Manually run the workflow
  push: # Run the workflow on changes to the configuration
    branches:
      - main
    paths:
      - renovate.json
      - .github/workflows/renovate.yml
      - .github/renovate-config.js

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@f0f41e5f2e706165f6814b1d0f0d0e319de7d1d9 # v46.3.8
        with:
          configurationFile: .github/renovate-config.js
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          LOG_LEVEL: debug
          # The registry of the Docker Hardened Images (the collab Dockerfile)
          # requires a login also for reads
          RENOVATE_HOST_RULES: '[{"hostType":"docker","matchHost":"dhi.io","username":"${{ vars.DOCKERHUB_USERNAME }}","password":"${{ secrets.DOCKERHUB_TOKEN }}"}]'
