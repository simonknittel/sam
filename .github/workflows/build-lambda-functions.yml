name: Build Lambda functions

on:
  workflow_call:
    inputs:
      git_ref:
        required: true
        type: string

# The unfiltered install below also runs the app's postinstall (`next typegen`),
# which loads src/env.ts. None of the runtime secrets exist here, so validation
# has to be skipped for the install to succeed.
env:
  SKIP_VALIDATION: "1"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.git_ref }}

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: pnpm-monorepo/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: "pnpm-monorepo/.nvmrc"
          cache: "pnpm"
          cache-dependency-path: "pnpm-monorepo/pnpm-lock.yaml"

      - name: pnpm audit guard
        run: pnpm audit
        working-directory: pnpm-monorepo

      - name: Install dependencies
        run: pnpm install
        working-directory: pnpm-monorepo

      - name: Build
        run: pnpm run build:lambda
        working-directory: pnpm-monorepo

      - name: Store artifact (midnight-automations)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: midnight-automations-dist
          path: pnpm-monorepo/apps/lambda/build/midnight-automations.zip
          retention-days: 1

      - name: Store artifact (frequent-automations)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frequent-automations-dist
          path: pnpm-monorepo/apps/lambda/build/frequent-automations.zip
          retention-days: 1

      - name: Store artifact (notification-router)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notification-router-dist
          path: pnpm-monorepo/apps/lambda/build/notification-router.zip
          retention-days: 1

      - run: mv pnpm-monorepo/apps/lambda/build/scrape-discord-events.zip pnpm-monorepo/apps/lambda/build/scrape-discord-events-function.zip
      - name: Store artifact (scrape-discord-events)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scrape-discord-events-function-dist
          path: pnpm-monorepo/apps/lambda/build/scrape-discord-events-function.zip
          retention-days: 1

      - name: Store artifact (email-function)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: email-function-dist
          path: pnpm-monorepo/apps/lambda/build/email-function.zip
          retention-days: 1
