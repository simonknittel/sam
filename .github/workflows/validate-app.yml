name: Validate app

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/validate-app.yml
      - pnpm-monorepo/apps/app/**
      - pnpm-monorepo/packages/**
      - pnpm-monorepo/pnpm-lock.yaml
      - pnpm-monorepo/pnpm-workspace.yaml
  push:
    branches:
      - main
    paths:
      - .github/workflows/validate-app.yml
      - pnpm-monorepo/apps/app/**
      - pnpm-monorepo/packages/**
      - pnpm-monorepo/pnpm-lock.yaml
      - pnpm-monorepo/pnpm-workspace.yaml

# The app's postinstall runs `next typegen`, which loads the app's modules and
# therefore src/env.ts. None of the runtime secrets exist here, so validation
# has to be skipped for the install to succeed.
env:
  SKIP_VALIDATION: "1"

jobs:
  lint:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.17.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: "pnpm-monorepo/.nvmrc"
          cache: "pnpm"
          cache-dependency-path: "pnpm-monorepo/pnpm-lock.yaml"

      - name: pnpm audit guard
        run: pnpm audit
        working-directory: pnpm-monorepo

      - name: Install dependencies
        run: pnpm install --filter @sam-monorepo/app...
        working-directory: pnpm-monorepo

      - name: Lint
        run: pnpm --filter @sam-monorepo/app run lint
        working-directory: pnpm-monorepo
        continue-on-error: true

  prettier:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.17.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: "pnpm-monorepo/.nvmrc"
          cache: "pnpm"
          cache-dependency-path: "pnpm-monorepo/pnpm-lock.yaml"

      - name: pnpm audit guard
        run: pnpm audit
        working-directory: pnpm-monorepo

      - name: Install dependencies
        run: pnpm install --filter @sam-monorepo/app...
        working-directory: pnpm-monorepo

      - name: Prettier
        run: pnpm --filter @sam-monorepo/app exec prettier --check .
        working-directory: pnpm-monorepo

  test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.17.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: "pnpm-monorepo/.nvmrc"
          cache: "pnpm"
          cache-dependency-path: "pnpm-monorepo/pnpm-lock.yaml"

      - name: pnpm audit guard
        run: pnpm audit
        working-directory: pnpm-monorepo

      - name: Install dependencies
        run: pnpm install --filter @sam-monorepo/app...
        working-directory: pnpm-monorepo

      - name: Test
        run: pnpm --filter @sam-monorepo/app run test
        working-directory: pnpm-monorepo
