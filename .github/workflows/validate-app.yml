name: Validate app

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/validate-app.yml
      - pnpm-monorepo/.nvmrc
      - pnpm-monorepo/apps/app/**
      - pnpm-monorepo/apps/lambda/**
      - pnpm-monorepo/apps/relay/**
      - pnpm-monorepo/apps/scripts/**
      - pnpm-monorepo/packages/**
      - pnpm-monorepo/pnpm-lock.yaml
      - pnpm-monorepo/pnpm-workspace.yaml
      - pnpm-monorepo/package.json
      - pnpm-monorepo/tsconfig.base.json
      - remote-control-program-definitions/**
      - remote-control-program-fixtures/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/validate-app.yml
      - pnpm-monorepo/.nvmrc
      - pnpm-monorepo/apps/app/**
      - pnpm-monorepo/apps/lambda/**
      - pnpm-monorepo/apps/relay/**
      - pnpm-monorepo/apps/scripts/**
      - pnpm-monorepo/packages/**
      - pnpm-monorepo/pnpm-lock.yaml
      - pnpm-monorepo/pnpm-workspace.yaml
      - pnpm-monorepo/package.json
      - pnpm-monorepo/tsconfig.base.json
      - remote-control-program-definitions/**
      - remote-control-program-fixtures/**

# Only one run per branch at a time. A new run cancels the run that is still
# in progress, because only the result for the latest commit matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: pnpm-monorepo/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: "pnpm-monorepo/.nvmrc"
          cache: "pnpm"
          cache-dependency-path: "pnpm-monorepo/pnpm-lock.yaml"

      - name: pnpm audit guard
        run: pnpm audit
        working-directory: pnpm-monorepo

      - name: Install dependencies
        run: pnpm install --filter @sam-monorepo/app...
        working-directory: pnpm-monorepo
        env:
          # The app's postinstall runs `next typegen`, which loads the app's
          # modules and therefore src/env.ts. None of the runtime secrets
          # exist here, so validation has to be skipped for the install to
          # succeed. Only the install skips it — the checks themselves run
          # with validation.
          SKIP_VALIDATION: "1"

      - name: Lint
        run: pnpm --filter @sam-monorepo/app run lint
        working-directory: pnpm-monorepo

  prettier:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: pnpm-monorepo/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: "pnpm-monorepo/.nvmrc"
          cache: "pnpm"
          cache-dependency-path: "pnpm-monorepo/pnpm-lock.yaml"

      - name: pnpm audit guard
        run: pnpm audit
        working-directory: pnpm-monorepo

      - name: Install dependencies
        run: pnpm install --filter @sam-monorepo/app...
        working-directory: pnpm-monorepo
        env:
          # See the lint job's install step
          SKIP_VALIDATION: "1"

      - name: Prettier
        run: pnpm --filter @sam-monorepo/app exec prettier --check .
        working-directory: pnpm-monorepo

  test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: pnpm-monorepo/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: "pnpm-monorepo/.nvmrc"
          cache: "pnpm"
          cache-dependency-path: "pnpm-monorepo/pnpm-lock.yaml"

      - name: pnpm audit guard
        run: pnpm audit
        working-directory: pnpm-monorepo

      - name: Install dependencies
        run: pnpm install --filter @sam-monorepo/app... --filter @sam-monorepo/lambda... --filter @sam-monorepo/relay...
        working-directory: pnpm-monorepo
        env:
          # See the lint job's install step
          SKIP_VALIDATION: "1"

      - name: Test app
        run: pnpm --filter @sam-monorepo/app run test
        working-directory: pnpm-monorepo

      - name: Test packages
        run: pnpm --filter @sam-monorepo/domain --filter @sam-monorepo/wiki-editor --filter @sam-monorepo/application --filter @sam-monorepo/infrastructure --filter @sam-monorepo/mcp --filter @sam-monorepo/remote-control-program-runtime run test
        working-directory: pnpm-monorepo

      - name: Test Lambda functions
        run: pnpm --filter @sam-monorepo/lambda run test
        working-directory: pnpm-monorepo

      # The integration tests start a PostgreSQL container (Testcontainers),
      # like the tests of the application package
      - name: Test relay service
        run: pnpm --filter @sam-monorepo/relay run test
        working-directory: pnpm-monorepo

      # The production server runs in UTC, thus a date rule that works only
      # in UTC would pass the steps above. The date code must give the same
      # result in each time zone.
      - name: Test app, domain, application, mcp and remote-control-program-runtime packages in a different time zone
        run: pnpm --filter @sam-monorepo/app --filter @sam-monorepo/domain --filter @sam-monorepo/application --filter @sam-monorepo/mcp --filter @sam-monorepo/remote-control-program-runtime run test
        working-directory: pnpm-monorepo
        env:
          TZ: America/Los_Angeles

  typecheck:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: pnpm-monorepo/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: "pnpm-monorepo/.nvmrc"
          cache: "pnpm"
          cache-dependency-path: "pnpm-monorepo/pnpm-lock.yaml"

      - name: pnpm audit guard
        run: pnpm audit
        working-directory: pnpm-monorepo

      - name: Install dependencies
        run: pnpm install --filter @sam-monorepo/app... --filter @sam-monorepo/lambda... --filter @sam-monorepo/scripts... --filter @sam-monorepo/mcp... --filter @sam-monorepo/relay...
        working-directory: pnpm-monorepo
        env:
          # See the lint job's install step
          SKIP_VALIDATION: "1"

      - name: Typecheck app
        run: pnpm --filter @sam-monorepo/app run typecheck
        working-directory: pnpm-monorepo

      - name: Typecheck packages
        run: pnpm --filter @sam-monorepo/domain --filter @sam-monorepo/wiki-editor --filter @sam-monorepo/application --filter @sam-monorepo/infrastructure --filter @sam-monorepo/mcp --filter @sam-monorepo/remote-control-program-runtime run typecheck
        working-directory: pnpm-monorepo

      - name: Typecheck scripts
        run: pnpm --filter @sam-monorepo/scripts run typecheck
        working-directory: pnpm-monorepo

      - name: Typecheck Lambda functions
        run: pnpm --filter @sam-monorepo/lambda run typecheck
        working-directory: pnpm-monorepo

      - name: Typecheck relay service
        run: pnpm --filter @sam-monorepo/relay run typecheck
        working-directory: pnpm-monorepo
