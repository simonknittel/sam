# Reusable workflow used by the Release workflow to send events to the
# `releases` channel of Soketi (e.g. to show a "deploying" or "new release"
# banner in the app).

name: Send release event

on:
  workflow_call:
    inputs:
      event:
        description: "Name of the event to send to the releases channel (e.g. deploying, new)"
        required: true
        type: string

jobs:
  send_event:
    name: Send event
    runs-on: ubuntu-24.04
    environment: Production
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: Send event
        env:
          HOST: ${{ vars.SOKETI_HOST }}
          APP_ID: ${{ vars.SOKETI_APP_ID }}
          APP_KEY: ${{ vars.SOKETI_APP_KEY }}
          APP_SECRET: ${{ secrets.SOKETI_APP_SECRET }}
          EVENT_NAME: ${{ inputs.event }}
        shell: bash
        run: |
          set -euo pipefail

          for var in HOST APP_ID APP_KEY APP_SECRET EVENT_NAME; do
            if [ -z "${!var:-}" ]; then
              echo "Missing required environment variable: $var" >&2
              exit 1
            fi
          done

          BODY=$(printf '{"name":"%s","channels":["releases"],"data":"{}"}' "$EVENT_NAME")
          BODY_MD5=$(printf '%s' "$BODY" | md5sum | awk '{print $1}')
          TIMESTAMP=$(date -u +%s)

          QUERY_BASE="auth_key=${APP_KEY}&auth_timestamp=${TIMESTAMP}&auth_version=1.0&body_md5=${BODY_MD5}"
          STRING_TO_SIGN=$'POST\n/apps/'"${APP_ID}"$'/events\n'"${QUERY_BASE}"
          SIGNATURE=$(printf '%s' "$STRING_TO_SIGN" | openssl dgst -sha256 -hmac "$APP_SECRET" -binary | xxd -p -c 256)

          curl -X POST "${HOST}/apps/${APP_ID}/events?${QUERY_BASE}&auth_signature=${SIGNATURE}" \
            -H "Content-Type: application/json" \
            -d "$BODY"
