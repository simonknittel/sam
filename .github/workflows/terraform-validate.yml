name: terraform validate

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - .github/workflows/terraform-validate.yml
      - terraform/**
  push:
    branches:
      - develop
    paths:
      - .github/workflows/terraform-validate.yml
      - terraform/**

jobs:
  validate:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Read .terraform-version
        id: terraform_version
        run: echo "value=$(cat .terraform-version)" >> $GITHUB_OUTPUT
        working-directory: terraform

      # The CLI version comes from .terraform-version, while Terraform itself
      # enforces required_version in main.tf. If the two drift apart, every
      # terraform command fails on "Unsupported Terraform Core version", which
      # does not say which file is wrong. Compare them up front instead.
      - name: Check .terraform-version matches required_version
        run: |
          required_version="$(sed -nE 's/^[[:space:]]*required_version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' main.tf)"

          if [ -z "$required_version" ]; then
            echo "::error file=terraform/main.tf::Could not read required_version from main.tf"
            exit 1
          fi

          if [ "$required_version" != "$pinned_version" ]; then
            echo "::error file=terraform/.terraform-version::.terraform-version pins $pinned_version but main.tf requires $required_version - update both to the same version"
            exit 1
          fi

          echo "Both pin Terraform $pinned_version"
        working-directory: terraform
        env:
          pinned_version: ${{ steps.terraform_version.outputs.value }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "${{ steps.terraform_version.outputs.value }}"

      - name: terraform init
        run: terraform init -backend=false
        working-directory: terraform

      - name: terraform validate
        run: terraform validate
        working-directory: terraform
