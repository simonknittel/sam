name: terraform apply

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "test"
        type: choice
        options:
          - test

jobs:
  # Plan and apply run in one job: a saved plan file contains the state with
  # all secrets in plain text. Thus, the plan file must not leave the runner
  # (artifacts of a public repository are available to all GitHub users).
  apply:
    runs-on: ubuntu-24.04

    # Related
    # - https://docs.github.com/en/actions/using-jobs/assigning-permissions-to-jobs
    # - https://docs.github.com/en/rest/authentication/permissions-required-for-github-apps
    permissions:
      id-token: write # Required for aws-actions/configure-aws-credentials
      contents: read # Required for aws-actions/configure-aws-credentials

    environment: "terraform-${{ inputs.environment }}"

    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read .terraform-version
        id: terraform_version
        run: echo "value=$(cat .terraform-version)" >> $GITHUB_OUTPUT
        working-directory: terraform

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "${{ steps.terraform_version.outputs.value }}"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.IAM_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Create tfvars file
        working-directory: terraform
        run: |
          cat > ${{ inputs.environment || 'test' }}.tfvars <<'EOF'
          ${{ vars.TFVARS }}
          EOF

      - name: terraform init
        run: terraform init -backend-config=${{ inputs.environment }}.s3.tfbackend
        working-directory: terraform

      - name: terraform plan
        run: terraform plan -no-color -out=tfplan -var-file=${{ inputs.environment || 'test' }}.tfvars
        working-directory: terraform

      - name: terraform apply
        run: terraform apply -var-file=${{ inputs.environment || 'test' }}.tfvars tfplan
        working-directory: terraform
