# Deploys the app (Vercel) and the Lambda functions (AWS) to production.
#
# This workflow is the manual gate for production deployments: pushes to main
# never deploy to production on their own. It runs automatically every Tuesday
# morning and can be triggered manually for ad-hoc releases and rollbacks
# (pass an older git ref to roll back).
#
# Requirements:
# - The Vercel project's Production Branch must be set to `production-gate`, a
#   frozen branch whose ruleset blocks all pushes, so pushes to main only
#   create preview deployments. See docs/releasing.md
# - The `Production` environment must provide the VERCEL_TOKEN, VERCEL_ORG_ID
#   and VERCEL_PROJECT_ID secrets

name: Release

on:
  schedule:
    - cron: "0 8 * * 2" # 8am UTC on Tuesday
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Git ref (SHA, tag, branch, ...) to release (if empty, releases the latest commit of the default branch)"
        type: string
        required: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Runs before all other jobs: each release, also a failed one, gets its own
  # number, and a release stops before it changes production if this job fails.
  create_release:
    name: Create Git tag and GitHub release
    runs-on: ubuntu-24.04

    permissions:
      contents: write # Required to create the tag and the release

    timeout-minutes: 5

    outputs:
      number: ${{ steps.create.outputs.number }}
      sha: ${{ steps.create.outputs.sha }}

    steps:
      - name: Create Git tag and GitHub release
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_REF: ${{ inputs.git_ref || github.sha }}
          # The Release workflow ran 104 times before it created release
          # numbers. The numbers continue this count.
          LAST_NUMBER_BEFORE_TAGS: 104
        shell: bash
        run: |
          set -euo pipefail

          # The ref goes into the API path below
          git check-ref-format --allow-onelevel "$GIT_REF"

          # Resolves branches, tags and (also abbreviated) commit SHAs, so all
          # jobs deploy the same commit
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GIT_REF" --jq .sha)

          highest=$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/release-" \
            --jq '.[].ref | capture("^refs/tags/release-(?<number>[0-9]+)$").number' \
            | sort -n | tail -n 1)
          number=$(( ${highest:-$LAST_NUMBER_BEFORE_TAGS} + 1 ))

          gh release create "release-$number" --repo "$GITHUB_REPOSITORY" \
            --target "$sha" --title "Release $number" --notes "" --latest

          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  preannounce:
    name: Preannounce release
    needs: [create_release]
    permissions:
      contents: read
    uses: ./.github/workflows/soketi-release-event.yml
    with:
      event: deploying
    secrets: inherit

  deploy_lambda_functions:
    name: Deploy Lambda functions
    needs: [create_release]
    permissions:
      id-token: write # Required for aws-actions/configure-aws-credentials
      contents: read # Required for aws-actions/configure-aws-credentials
    uses: ./.github/workflows/deploy-lambda-functions.yml
    with:
      git_ref: ${{ needs.create_release.outputs.sha }}
    secrets: inherit

  deploy_app:
    name: Deploy app to Vercel
    needs: [create_release]
    runs-on: ubuntu-24.04

    environment: Production

    permissions:
      contents: read

    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.create_release.outputs.sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: "pnpm-monorepo/.nvmrc"

      - name: Install Vercel CLI
        run: npm install --global vercel@58.5.1

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          RELEASE_NUMBER: ${{ needs.create_release.outputs.number }}
          COMMIT_SHA: ${{ needs.create_release.outputs.sha }}
        run: |
          vercel deploy --prod --yes --token="$VERCEL_TOKEN" \
            --build-env NEXT_PUBLIC_RELEASE_NUMBER="$RELEASE_NUMBER" \
            --env COMMIT_SHA="$COMMIT_SHA"

  announce:
    name: Announce release
    needs: [deploy_lambda_functions, deploy_app]
    permissions:
      contents: read
    uses: ./.github/workflows/soketi-release-event.yml
    with:
      event: new
    secrets: inherit
