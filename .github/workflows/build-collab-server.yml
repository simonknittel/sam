name: Build collab server

on:
  push:
    branches:
      - main
    paths:
      - pnpm-monorepo/apps/collab/**
      - pnpm-monorepo/packages/database/**
      - pnpm-monorepo/packages/wiki-editor/**
      - pnpm-monorepo/pnpm-lock.yaml
      - .github/workflows/build-collab-server.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: pnpm-monorepo
          file: pnpm-monorepo/apps/collab/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/sam-collab:latest
            ghcr.io/${{ github.repository_owner }}/sam-collab:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The newest version carries the `latest` tag, so keeping the 5 newest never deletes it.
      - uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: sam-collab
          package-type: container
          min-versions-to-keep: 5
