# Reference: https://docs.docker.com/compose/compose-file/compose-file-v3/

services:
  devcontainer:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      # Mount the project's root directory (which also contains .git)
      - ../../../..:/workspace:cached
      # Mount node_modules into a volume to improve performance (see https://code.visualstudio.com/remote/advancedcontainers/improve-performance#_use-a-targeted-named-volume)
      - devcontainer-node_modules:/workspace/pnpm-monorepo/apps/app/node_modules
    network_mode: service:db
    command: sleep infinity

  db:
    image: postgres:18.6-alpine3.23@sha256:885cf05d376c7cf27afef02073e6bdac3841252537f16e244fd1c1e6a7c99fb1
    restart: no
    environment:
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: db
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  devcontainer-node_modules:
  db-data:
