packages:
  - apps/*
  - packages/*

injectWorkspacePackages: true

linkWorkspacePackages: true

# Refresh injected workspace copies after these scripts run (belt-and-braces;
# in practice the packages resolve as symlinks and dist freshness comes from
# packages/database's postinstall/build running tsc).
syncInjectedDepsAfterScripts:
  - build
  - postinstall
  - migrate:dev

overrides:
  bn.js@<4.12.3: ">=4.12.3"
  fast-xml-parser@>=5.0.0 <5.3.8: ">=5.3.8"
  jws@=4.0.0: ">=4.0.1"
  # Migrated from apps/app's former npm `overrides`.
  "@auth/core": 0.41.3
  "@types/react": 19.2.18
  "@types/react-dom": 19.2.4
  tar: 7.5.22
  zod-validation-error: 5.0.0
  # eslint-config-next depends on `typescript-eslint: ^8.46.0`, which resolves
  # to a second copy of the package next to the exact version that apps/app
  # depends on. ESLint then refuses the app config, because the Next.js preset
  # and apps/app/eslint.config.mjs register two different plugin objects under
  # the name `@typescript-eslint`. Keep this in sync with the version in
  # apps/app/package.json.
  typescript-eslint: 8.67.0

preferFrozenLockfile: true
legacyPeerDeps: true
saveExact: true
# Equivalent of the former `min-release-age=7` (days) in apps/app's .npmrc;
# pnpm measures in minutes. Renovate mirrors this with `minimumReleaseAge`.
# Non-strict: like npm, existing lockfile entries install fine; immature
# versions are auto-collected into minimumReleaseAgeExclude and show up in
# diffs instead of hard-failing CI.
minimumReleaseAge: 10080
minimumReleaseAgeStrict: false
allowBuilds:
  # Since Prisma 7 the client no longer has a postinstall script (generation
  # happens explicitly via `prisma generate` in packages/database).
  "@prisma/client": false
  "@prisma/engines": true
  "@parcel/watcher": true
  "@swc/core": true
  esbuild: true
  prisma: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
  # The database package's postinstall (generate + patch + tsc) already runs as
  # a workspace project lifecycle; no need to run it again as a dependency
  # build of apps/app.
  "@sam-monorepo/database@file:packages/database": false
  # Same reasoning as for the database package: the postinstall (tsc) already
  # runs as a workspace project lifecycle.
  "@sam-monorepo/domain@file:packages/domain": false
  "@sam-monorepo/notifications@file:packages/notifications": false
  "@sam-monorepo/permissions@file:packages/permissions": false
  # Optional native accelerators of testcontainers' ssh2 dependency — the
  # pure-JS fallbacks are fine for the test stack.
  cpu-features: false
  ssh2: false
auditLevel: critical
# Versions that `pnpm install` was allowed to resolve before they reached
# `minimumReleaseAge`. pnpm appends to this list on its own. Next.js 16.3.3 is
# here on request: it fixes two critical remote-code-execution advisories, so
# it must not wait out the 7-day cooldown.
minimumReleaseAgeExclude:
  - "@next/env@16.3.3"
  - "@next/eslint-plugin-next@16.3.3"
  - "@next/swc-darwin-arm64@16.3.3"
  - "@next/swc-darwin-x64@16.3.3"
  - "@next/swc-linux-arm64-gnu@16.3.3"
  - "@next/swc-linux-arm64-musl@16.3.3"
  - "@next/swc-linux-x64-gnu@16.3.3"
  - "@next/swc-linux-x64-musl@16.3.3"
  - "@next/swc-win32-arm64-msvc@16.3.3"
  - "@next/swc-win32-x64-msvc@16.3.3"
  - eslint-config-next@16.3.3
  - next@16.3.3
