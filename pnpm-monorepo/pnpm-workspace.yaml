packages:
  - apps/*
  - packages/*

injectWorkspacePackages: true

linkWorkspacePackages: true

overrides:
  bn.js@<4.12.3: ">=4.12.3"
  fast-xml-parser@>=5.0.0 <5.3.8: ">=5.3.8"
  jws@=4.0.0: ">=4.0.1"

preferFrozenLockfile: true
legacyPeerDeps: true
saveExact: true
allowBuilds:
  # Since Prisma 7 the client no longer has a postinstall script (generation
  # happens explicitly via `prisma generate` in packages/database).
  "@prisma/client": false
  "@prisma/engines": true
  esbuild: true
  prisma: true
  sharp: true
auditLevel: critical
